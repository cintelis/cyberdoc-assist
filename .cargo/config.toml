# NASM is needed on x86-64 Windows to assemble OpenH264 (compiled from source by
# the agent's openh264-sys2 dependency). This is a development convenience: it
# lets aws-lc-sys, if any TLS dependency pulls it in, use AWS's shipped assembler
# output rather than requiring NASM. It has no effect on Linux or macOS.
[env]
AWS_LC_SYS_PREBUILT_NASM = { value = "1", force = false }
