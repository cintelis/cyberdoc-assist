[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
publish = false

[workspace.dependencies]
assist-proto = { path = "crates/assist-proto" }

# Self-contained: this workspace does not depend on any other CyberDoc platform.
# Session grants are Ed25519-signed; the session audit log is a SHA-256 hash
# chain — both implemented here (crates/assist-proto,
# crates/assist-broker/src/audit.rs).
ed25519-dalek = "2"
sha2 = "0.10"

anyhow = "1"
base64ct = { version = "1.8", features = ["alloc"] }
clap = { version = "4", features = ["derive", "env"] }
rand = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "time", "sync", "io-std"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[workspace.lints.rust]
# Our own code needs no unsafe: the OS-facing work (capture, encode, input) is
# done by crates that wrap it.
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
