[package]
name = "assist-agent"
description = "Runs on the client's computer: asks consent, streams the screen over WebRTC, applies input once control is approved"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
assist-proto = { workspace = true }
ed25519-dalek = { workspace = true }
anyhow = { workspace = true }
async-trait = "0.1"
bytes = "1"
clap = { workspace = true }
rand = { workspace = true }
enigo = "0.6"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
image = { version = "0.25", default-features = false }
openh264 = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
# The sans-I/O core behind `webrtc`; the type definitions (Sample, codec params,
# session description) live here and `webrtc` re-exports only some of them.
rtc = "0.21"
serde_json = { workspace = true }
tokio = { workspace = true }
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
webrtc = "0.21"
xcap = "0.9"

[lints]
workspace = true
